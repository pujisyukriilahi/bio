<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="author" content="Puji Syukri Ilahi">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="en_US">
  <meta property="og:title" content="{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  {% seo %}
  {% if page.layout == 'post' %}
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"Article","headline":{{ page.title | jsonify }},"description":{{ page.description | default: site.description | jsonify }},"datePublished":"{{ page.date | date_to_xmlschema }}","dateModified":"{{ page.last_modified_at | default: page.date | date_to_xmlschema }}","inLanguage":"id-ID","author":{"@type":"Person","name":"Puji Syukri Ilahi","url":"{{ site.author.url }}"},"mainEntityOfPage":{"@type":"WebPage","@id":"{{ page.url | absolute_url }}"}}
  </script>
  {% else %}
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"Person","name":"Puji Syukri Ilahi","url":"{{ site.author.url }}","jobTitle":"Strategic Marketing, Market Intelligence & Business Growth Professional","knowsAbout":["Marketing Strategy","Market Intelligence","Business Growth","Marketing Analytics","Performance Marketing","Corporate Learning","AI for Marketing"],"sameAs":["https://github.com/pujisyukriilahi"]}
  </script>
  {% endif %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
<header><div class="wrap"><nav><a class="brand" href="{{ '/' | relative_url }}">PUJI SYUKRI ILAHI</a><div class="menu"><a href="{{ '/' | relative_url }}#about">About</a><a href="{{ '/' | relative_url }}#work">Portfolio</a><a href="{{ '/' | relative_url }}#experience">Experience</a><a href="{{ '/insights/' | relative_url }}">Insights</a><a href="{{ '/' | relative_url }}#contact">Contact</a></div></nav></div></header>
<main>{{ content }}</main>
<footer><div class="wrap">© {{ 'now' | date: '%Y' }} Puji Syukri Ilahi · Research • Strategy • Commercial • Learning</div></footer>
</body>
</html>
