<!doctype html>
<html lang="{{ site.lang | default: 'id' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="author" content="Puji Syukri Ilahi">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="id_ID">
  <meta property="og:title" content="{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  {% seo %}
  {% if page.layout == 'post' %}
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"Article","headline":{{ page.title | jsonify }},"description":{{ page.description | default: site.description | jsonify }},"datePublished":"{{ page.date | date_to_xmlschema }}","dateModified":"{{ page.last_modified_at | default: page.date | date_to_xmlschema }}","inLanguage":"id-ID","author":{"@type":"Person","name":"Puji Syukri Ilahi","url":"{{ site.author.url }}"},"mainEntityOfPage":{"@type":"WebPage","@id":"{{ page.url | absolute_url }}"}}
  </script>
  {% else %}
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"Person","name":"Puji Syukri Ilahi","url":"{{ site.author.url }}","jobTitle":"Profesional Marketing Strategis, Market Intelligence & Pembelajaran Korporat","knowsAbout":["Strategi Marketing","Market Intelligence","Pertumbuhan Bisnis","Analitik Marketing","Performance Marketing","Pembelajaran Korporat","AI untuk Marketing"],"sameAs":["https://github.com/pujisyukriilahi"]}
  </script>
  {% endif %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
<header><div class="wrap"><nav><a class="brand" href="{{ '/' | relative_url }}">PUJI SYUKRI ILAHI</a><div class="menu"><a href="{{ '/' | relative_url }}#about">Tentang</a><a href="{{ '/' | relative_url }}#work">Portofolio</a><a href="{{ '/' | relative_url }}#experience">Pengalaman</a><a href="{{ '/insights/' | relative_url }}">Insight</a><a href="{{ '/' | relative_url }}#contact">Kontak</a></div></nav></div></header>
<main>{{ content }}</main>
<footer><div class="wrap">© {{ 'now' | date: '%Y' }} Puji Syukri Ilahi · Riset • Strategi • Komersial • Pembelajaran</div></footer>
</body>
</html>
