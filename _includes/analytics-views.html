<script>
(function () {
  const path = window.location.pathname;
  const isArticle = path.indexOf('/insights/') !== -1 && path !== '{{ "/insights/" | relative_url }}';
  if (!isArticle) return;

  const apiBase = 'https://api.countapi.xyz';
  const key = encodeURIComponent('pujisyukriilahi-bio' + path.replace(/\/$/, '').replace(/[^a-zA-Z0-9]+/g, '-').toLowerCase());

  fetch(apiBase + '/hit/' + key)
    .then(function (response) { return response.json(); })
    .then(function (data) {
      const counter = document.querySelector('[data-view-count]');
      if (counter && typeof data.value !== 'undefined') counter.textContent = Number(data.value).toLocaleString('id-ID') + ' views';
    })
    .catch(function () {});

  fetch(apiBase + '/get/' + key)
    .then(function (response) { return response.json(); })
    .then(function (data) {
      const counter = document.querySelector('[data-view-count]');
      if (counter && typeof data.value !== 'undefined') counter.textContent = Number(data.value).toLocaleString('id-ID') + ' views';
    })
    .catch(function () {});
})();
</script>
